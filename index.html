<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收入計算機</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>收入計算機</h1>

        <div class="input-group">
            <label for="nhisRatio">健保成數 (%)</label>
            <input type="number" id="nhisRatio" value="100" placeholder="例如：100" min="0">
        </div>

        <div class="input-group">
            <label for="selfPayRatio">自費成數 (%)</label>
            <input type="number" id="selfPayRatio" value="100" placeholder="例如：100" min="0">
        </div>

        <hr>

        <div class="input-group">
            <label for="nhisIncome">健保收入</label>
            <input type="number" id="nhisIncome" value="0" placeholder="請輸入金額" min="0">
        </div>

        <div class="input-group">
            <label for="sopCost">SOP 成本</label>
            <input type="number" id="sopCost" value="0" placeholder="請輸入金額" min="0">
        </div>

        <div class="input-group">
            <label for="selfPayIncome">自費收入</label>
            <input type="number" id="selfPayIncome" value="0" placeholder="請輸入金額" min="0">
        </div>

        <div class="input-group">
            <label for="technicianCost">技工費</label>
            <input type="number" id="technicianCost" value="0" placeholder="請輸入金額" min="0">
        </div>

        <div class="input-group">
            <label for="mealCost">餐費</label>
            <input type="number" id="mealCost" value="0" placeholder="請輸入金額" min="0">
        </div>

        <div class="input-group">
            <label for="otherCost">其他</label>
            <input type="number" id="otherCost" value="0" placeholder="請輸入金額" min="0">
        </div>

        <div class="button-group">
            <button id="calculateBtn">計算總額</button>
            <button id="clearBtn">清除</button>
        </div>

        <div class="result-area">
            <p>總額：</p>
            <p id="totalAmount">0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
